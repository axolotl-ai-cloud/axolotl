# Qwen3.8-Flash-Next MoE LoRA on an NVFP4 (modelopt) checkpoint via SonicMoE.
# Only the 512 routed experts per layer are NVFP4; attention, the Gated DeltaNet layers, the
# router gate and the shared expert stay bf16, so merge-aware fake-quant applies to the experts.
base_model: Inferact/Qwen3.8-Flash-Next-NVFP4

plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin
  - axolotl.integrations.kernels.KernelsPlugin
use_sonicmoe: true
# train an adapter that `merge-lora` can merge back into a plain NVFP4 checkpoint losslessly
nvfp4_merge_aware: true
strict: false

chat_template: tokenizer_default
datasets:
  - path: mlabonne/FineTome-100k
    type: chat_template
    split: train[:2%]
    field_messages: conversations
    message_property_mappings:
      role: from
      content: value
dataset_prepared_path: last_run_prepared
val_set_size: 0
output_dir: ./outputs/qwen3.8-flash-next-nvfp4-lora

sequence_len: 2048

# Packing works on this arch (see qlora.yaml), but the NVFP4 path itself is unvalidated,
# so this config keeps the variables to a minimum.
sample_packing: false

# the QSA indexer's 4D selection mask only reaches sdpa or eager, not flash or flex
attn_implementation: sdpa

adapter: lora
lora_r: 16
lora_alpha: 32
lora_dropout: 0
lora_target_modules:
  # 36 of 48 layers are Gated DeltaNet; its projections are split, not fused as in qwen3_next
  - linear_attn.in_proj_qkv
  - linear_attn.in_proj_z
  - linear_attn.in_proj_b
  - linear_attn.in_proj_a
  - linear_attn.out_proj
  # the remaining 12 are QSA full-attention layers; the indexer is gradientless, never target it
  - q_proj
  - k_proj
  - v_proj
  - o_proj
lora_target_parameters:
  - mlp.experts.gate_up_proj
  - mlp.experts.down_proj

# merge-aware bypasses lora.Linear.forward if these are on, silently skipping the fake-quant
lora_mlp_kernel: false
lora_qkv_kernel: false
lora_o_kernel: false

micro_batch_size: 1
gradient_accumulation_steps: 1
num_epochs: 1
optimizer: adamw_torch_fused
lr_scheduler: cosine
learning_rate: 0.0002
warmup_ratio: 0.1

bf16: auto
tf32: true
gradient_checkpointing: true

logging_steps: 1
saves_per_epoch: 1

wandb_project:
wandb_entity:
wandb_name:

# the auto device map sizes this pre-quantized checkpoint at bf16 and spills to CPU,
# which accelerate cannot then place; pin it to one GPU
device_map:
  "": 0
