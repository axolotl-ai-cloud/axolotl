# Beam (ReflectionForCausalLM) -- QLoRA via the CPU-staged FSDP2 loader.
#
# Requires axolotl PR #4003 (features/nf4-fsdp2), which adds both pieces this
# model needs:
#   * chunked bnb NF4 quant/dequant, so fused expert tensors past the 2**31
#     element ceiling can be quantized at all
#   * qlora_sharded_model_loading: rank 0 quantizes the bf16 checkpoint in
#     bounded GPU chunks into CPU RAM, other ranks build on meta, and parameter
#     shards transfer after FSDP wrapping -- so no rank ever holds a full replica
#
# Sized for one 8x H200 node (143 GiB/GPU, ~1 TB host RAM). Rank 0 needs host RAM
# for the packed model (~250 GB) plus conversion temporaries.
base_model: ./beam-tiny

chat_template: tokenizer_default
datasets:
  - path: ./smoke_data.jsonl
    type: chat_template
    ds_type: json

val_set_size: 0.0
output_dir: ./outputs/beam-tiny-mp

sequence_len: 512
# ssmax scales attention off position_ids and packing rewrites them per document;
# leave off until that interaction is measured.
sample_packing: false
pad_to_sequence_len: true

adapter: qlora
load_in_4bit: true
quantize_moe_experts: true
nf4_backend: bitsandbytes

lora_r: 16
lora_alpha: 32
# must be 0: PEFT's ParamWrapper rejects dropout on target_parameters
lora_dropout: 0.0

# lora_target_linear is rejected with quantize_moe_experts, and `gate_proj` is
# ambiguous here -- it names both the attention output gate and the dense MLP.
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
# Experts are fused 3D nn.Parameter tensors, unreachable as linear modules.
# The router (mlp.gate.weight) is a bare Parameter too and is deliberately absent:
# adapting a noaux_tc router destabilizes expert routing.
lora_target_parameters:
  - mlp.experts.gate_up_proj
  - mlp.experts.down_proj

micro_batch_size: 1
gradient_accumulation_steps: 2
num_epochs: 1
optimizer: adamw_torch_4bit
lr_scheduler: cosine
learning_rate: 0.0002
warmup_ratio: 0.1
weight_decay: 0.0

train_on_inputs: false
bf16: auto
tf32: true

gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false


# Rank 0 alone reads and quantizes the whole checkpoint while ranks 1-7 wait at a
# collective. That staging takes well over the default 1800s barrier, so the other
# ranks abort with "TCPStore doWait ... timeout after 1800000ms". Give it hours.
ddp_timeout: 21600

# no flash-attn build for torch 2.13+cu130; sample_packing is off so varlen is moot
attn_implementation: sdpa
logging_steps: 1
max_steps: 3
save_strategy: "no"

special_tokens:
  eos_token: "<|return|>"
  pad_token: "<|endoftext|>"

device_map: auto
gpu_memory_limit: 60GiB
