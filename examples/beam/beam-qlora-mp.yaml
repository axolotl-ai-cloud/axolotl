# Beam QLoRA via device_map model parallelism (no FSDP).
#
# Alternative to the CPU-staged FSDP2 loader (beam-qlora-fsdp-staged.yaml, the
# preferred path now that upstream scatters shards). Here layers are placed
# across the 8 GPUs at load time and each is quantized in place. No data
# parallelism, so throughput is low; launch with --num-processes 1.
#
# Needs infer_auto_device_map to receive no_split_module_classes, otherwise a
# decoder layer can straddle two GPUs and its residual add raises.
# Beam (ReflectionForCausalLM) -- QLoRA via the CPU-staged FSDP2 loader.
#
# Requires axolotl PR #4003 (features/nf4-fsdp2), which adds both pieces this
# model needs:
#   * chunked bnb NF4 quant/dequant, so fused expert tensors past the 2**31
#     element ceiling can be quantized at all
#   * qlora_sharded_model_loading: rank 0 quantizes the bf16 checkpoint in
#     bounded GPU chunks into CPU RAM, other ranks build on meta, and parameter
#     shards transfer after FSDP wrapping -- so no rank ever holds a full replica
#
# Sized for one 8x H200 node (143 GiB/GPU, ~1 TB host RAM). Rank 0 needs host RAM
# for the packed model (~250 GB) plus conversion temporaries.
base_model: ./beam

chat_template: tokenizer_default
datasets:
  - path: ./smoke_data.jsonl
    type: chat_template
    ds_type: json

val_set_size: 0.0
output_dir: ./outputs/beam-real-mp

sequence_len: 2048
# ssmax scales attention off position_ids and packing rewrites them per document;
# leave off until that interaction is measured.
sample_packing: false
pad_to_sequence_len: true

adapter: qlora
load_in_4bit: true
quantize_moe_experts: true
nf4_backend: bitsandbytes

lora_r: 16
lora_alpha: 32
# must be 0: PEFT's ParamWrapper rejects dropout on target_parameters
lora_dropout: 0.0

# lora_target_linear is rejected with quantize_moe_experts, and `gate_proj` is
# ambiguous here -- it names both the attention output gate and the dense MLP.
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
# Attention only: the experts stay frozen (still nf4-quantized, just no adapters).
# See beam-qlora-experts-mp.yaml to train them via lora_target_parameters.

micro_batch_size: 1
gradient_accumulation_steps: 2
num_epochs: 1
# adamw_torch_4bit raises once device_map spreads adapters across GPUs
optimizer: adamw_torch
lr_scheduler: cosine
learning_rate: 0.0002
warmup_ratio: 0.1
weight_decay: 0.0

train_on_inputs: false
bf16: auto
tf32: true

gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false


# Rank 0 alone reads and quantizes the whole checkpoint while ranks 1-7 wait at a
# collective. That staging takes well over the default 1800s barrier, so the other
# ranks abort with "TCPStore doWait ... timeout after 1800000ms". Give it hours.
ddp_timeout: 21600

# no flash-attn build for torch 2.13+cu130; sample_packing is off so varlen is moot
attn_implementation: sdpa
logging_steps: 1
max_steps: 5
save_strategy: "no"

special_tokens:
  eos_token: "<|return|>"
  pad_token: "<|endoftext|>"

device_map: auto
# sized against the bf16 estimate (~1004 GB), not the ~254 GB nf4 reality
gpu_memory_limit: 140GiB
