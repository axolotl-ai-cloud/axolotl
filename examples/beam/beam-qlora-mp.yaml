# Beam QLoRA via device_map model parallelism (attention-only, no FSDP).
# Layers are placed across the GPUs and quantized in place. No data parallelism,
# so launch with --num-processes 1.
base_model: reflection/Beam-1.0-501B-A23B

plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin

chat_template: tokenizer_default
datasets:
  - path: fozziethebeat/alpaca_messages_2k_test
    type: chat_template

val_set_size: 0.0
output_dir: ./outputs/beam-real-mp

sequence_len: 2048
sample_packing: true
pad_to_sequence_len: true

adapter: qlora
load_in_4bit: true
quantize_moe_experts: true
nf4_backend: bitsandbytes

lora_r: 16
lora_alpha: 32
# must be 0: PEFT's ParamWrapper rejects dropout on target_parameters
lora_dropout: 0.0

# lora_target_linear is rejected with quantize_moe_experts, and `gate_proj` is
# ambiguous here -- it names both the attention output gate and the dense MLP.
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
# Attention only: the experts stay frozen (still nf4-quantized, just no adapters).
# See beam-qlora-experts-mp.yaml to train them via lora_target_parameters.

micro_batch_size: 1
gradient_accumulation_steps: 2
num_epochs: 1
# adamw_torch_4bit raises once device_map spreads adapters across GPUs
optimizer: adamw_torch
lr_scheduler: cosine
learning_rate: 0.0002
warmup_ratio: 0.1
weight_decay: 0.0

train_on_inputs: false
bf16: auto
tf32: true

gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

# flash_attention_2: transformers>=5.18.0 fixed the FA2 version mapping for this
# arch; FA2 gives the varlen path the hybrid sliding-window attention wants.
attn_implementation: flash_attention_2
logging_steps: 1
max_steps: 5

special_tokens:
  eos_token: "<|return|>"
  pad_token: "<|endoftext|>"

device_map: auto
# sized against the bf16 estimate (~1004 GB), not the ~254 GB nf4 reality
gpu_memory_limit: 140GiB
