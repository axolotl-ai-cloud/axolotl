base_model: google/gemma-4-31B

plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin
  - axolotl.integrations.liger.LigerPlugin
liger_layer_norm: true
liger_rope: false
liger_rms_norm: true
liger_glu_activation: true
strict: false

chat_template: gemma4
eot_tokens:
  - "<turn|>"
datasets:
  - path: mlabonne/FineTome-100k
    type: chat_template
    split: train[:10%]
    field_messages: conversations
    message_property_mappings:
      role: from
      content: value
val_set_size: 0.05
output_dir: ./outputs/gemma4-31b-lora

sequence_len: 32768
sample_packing: true

adapter: lora
lora_r: 256
lora_alpha: 512
lora_dropout: 0.05
# Restrict LoRA to text backbone only (skip vision/audio encoders)
# using regex to match only the text decoder attention projections.
lora_target_modules: 'model.language_model.layers.[\d]+.(_checkpoint_wrapped_module.)?(mlp|self_attn).(up|down|gate|q|k|v|o)_proj'

gradient_accumulation_steps: 1
micro_batch_size: 1
num_epochs: 1
optimizer: adamw_torch_8bit
lr_scheduler: cosine
learning_rate: 0.00005
optim_args:
  bf16_stochastic_round: true
adam_beta2: 0.995
max_grad_norm: 0.1

bf16: auto
tf32: true

gradient_checkpointing: true
activation_offloading: true
logging_steps: 1

gemma4_hybrid_attn_impl: true
attn_implementation: flash_attention_2

warmup_ratio: 0.1
evals_per_epoch: 1
saves_per_epoch: 1
weight_decay: 0.0

fsdp_version: 2
fsdp_config:
  offload_params: false
  auto_wrap_policy: TRANSFORMER_BASED_WRAP
  transformer_layer_cls_to_wrap: Gemma4TextDecoderLayer
  state_dict_type: SHARDED_STATE_DICT
  final_state_dict_type: FULL_STATE_DICT
  reshard_after_forward: true
