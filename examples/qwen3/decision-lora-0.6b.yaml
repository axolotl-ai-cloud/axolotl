base_model: Qwen/Qwen3-0.6B
plugins:
  - axolotl.integrations.causal_decision.CausalDecisionPlugin

causal_decision:
  num_options: 16  # answer letters A-P
  rank: 16
  shuffle: true

datasets:
  - path: json
    data_files: ./data/decision-train.jsonl
    split: train
    type: diffusion_decision.jsonl
test_datasets:
  - path: json
    data_files: ./data/decision-dev.jsonl
    split: dev
    type: diffusion_decision.jsonl

adapter: lora
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
lora_target_linear: true

sequence_len: 4096
sample_packing: false
micro_batch_size: 8
gradient_accumulation_steps: 4
num_epochs: 1
optimizer: adamw_torch_fused
lr_scheduler: cosine
learning_rate: 1e-4
warmup_ratio: 0.05

bf16: auto
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

output_dir: ./outputs/qwen3-decision-0.6b
logging_steps: 1
eval_strategy: steps
eval_steps: 50
save_strategy: steps
save_steps: 50
seed: 42
