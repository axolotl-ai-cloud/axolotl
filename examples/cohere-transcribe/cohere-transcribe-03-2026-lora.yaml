base_model: CohereLabs/cohere-transcribe-03-2026

skip_prepare_dataset: true
remove_unused_columns: false
sample_packing: false

datasets:
  - path: google/fleurs
    name: en_us
    split: train

asr:
  audio_column: audio
  text_column: raw_transcription
  language: en
  punctuation: true

train_on_inputs: false

dataset_prepared_path: last_run_prepared
val_set_size: 0.02
output_dir: ./outputs/cohere-transcribe-lora

adapter: lora
lora_model_dir:

sequence_len: 448

lora_r: 32
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules: 'model\.(encoder\.layers\.\d+\.(self_attn\.(q|k|v|o)_proj|feed_forward[12]\.linear[12])|decoder\.layers\.\d+\.((self|encoder)_attn\.(q|k|v|o)_proj|mlp\.fc[12]))'

wandb_project:
wandb_entity:
wandb_watch:
wandb_name:
wandb_log_model:

gradient_accumulation_steps: 2
micro_batch_size: 8
num_epochs: 2
optimizer: adamw_torch_fused
lr_scheduler: cosine
learning_rate: 0.0001

bf16: auto
tf32: true

activation_checkpointing: true
logging_steps: 1
attn_implementation: sdpa

warmup_ratio: 0.05
evals_per_epoch: 2
saves_per_epoch: 1
weight_decay: 0.0
