base_model: CohereLabs/North-Micro-Vision-Instruct
processor_type: AutoProcessor

plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin
  - axolotl.integrations.liger.LigerPlugin
cut_cross_entropy: true
liger_glu_activation: true
liger_layer_norm: true

load_in_4bit: true

skip_prepare_dataset: true
remove_unused_columns: false
sample_packing: false

datasets:
  - path: HuggingFaceH4/llava-instruct-mix-vsft
    type: chat_template
    split: train[:1%]
    field_messages: messages

dataset_prepared_path: last_run_prepared
val_set_size: 0.0
output_dir: ./outputs/north-micro-vision-qlora-vision

adapter: qlora
lora_model_dir:

sequence_len: 4096
pad_to_sequence_len: false

lora_r: 32
lora_alpha: 16
lora_dropout: 0
# Decoder + vision blocks + the patch mergers. `linear_fc1`/`linear_fc2` name both the vision MLP
# and the mergers, so each site is matched by its full path rather than by suffix.
lora_target_modules: '(model\.language_model\.layers\.\d+\.(self_attn\.(q|k|v|o)_proj|mlp\.(gate|up|down)_proj)|model\.visual\.(blocks\.\d+\.(attn\.(qkv|proj)|mlp\.linear_fc[12])|merger\.linear_fc[12]|deepstack_merger_list\.\d+\.linear_fc[12]))'

wandb_project:
wandb_entity:
wandb_watch:
wandb_name:
wandb_log_model:

gradient_accumulation_steps: 4
micro_batch_size: 1
num_epochs: 1
optimizer: adamw_bnb_8bit
lr_scheduler: cosine
learning_rate: 0.0002

bf16: auto
fp16:
tf32: true

gradient_checkpointing: true
logging_steps: 1
attn_implementation: flash_attention_2

warmup_ratio: 0.1
evals_per_epoch: 0
saves_per_epoch: 1
weight_decay: 0.0

# save_first_step: true  # uncomment this to validate checkpoint saving works with your config
