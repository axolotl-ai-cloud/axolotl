# Fermion Research Neutrino-1 8B
#
# FermionResearch/Neutrino-8B cannot be used as `base_model` directly: it ships
# only `neutrino-8b_v4.bin`, a packed five-value (FV5) ternary container whose
# config.json declares `model_type: trtc_v4` with no `auto_map`, so transformers
# has nothing to load. Expand it to dense bf16 safetensors first (one-off, ~16GB
# out, and point `base_model` at wherever you put it):
#
#   python examples/neutrion/convert_trtc_v4_to_hf.py \
#     ~/.cache/huggingface/hub/models--FermionResearch--Neutrino-8B/snapshots/*/neutrino-8b_v4.bin \
#     /workspace/neutrino-8b-hf
#
# The expansion is exact -- ternary planes times per-row scales, int8 embeddings
# times per-row scales -- and arch-3 is the Qwen3 topology, so it renames 1:1
# onto Qwen3ForCausalLM (36L, hidden 4096, 32/8 heads, head_dim 128, vocab
# 151936, rope theta 1e6, 8,190,735,360 params). Training therefore starts from
# Neutrino's post-training, not from Qwen3-8B's.
#
# The trained adapter merges into a dense bf16 Qwen3 checkpoint. Axolotl cannot
# re-pack FV5 (`qat:` covers int4/int8/fp8/nvfp4 only), so serve the result as a
# normal Qwen3 model, not on Fermion's runtimes.

base_model: /workspace/neutrino-8b-hf

load_in_8bit: false
load_in_4bit: false
strict: false

chat_template: tokenizer_default
datasets:
  - path: tatsu-lab/alpaca
    type: alpaca
dataset_prepared_path: last_run_prepared
val_set_size: 0.05
output_dir: ./outputs/neutrino-8b-lora

sequence_len: 8192
sample_packing: true
eval_sample_packing: true

adapter: lora
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
lora_target_linear: true

fused_attn_kernel: true

gradient_accumulation_steps: 4
micro_batch_size: 1
num_epochs: 1
optimizer: adamw_torch_fused
lr_scheduler: cosine
learning_rate: 0.0002

bf16: auto
tf32: false

gradient_checkpointing: true
flash_attention: true

warmup_ratio: 0.1
saves_per_epoch: 1
weight_decay: 0.0
