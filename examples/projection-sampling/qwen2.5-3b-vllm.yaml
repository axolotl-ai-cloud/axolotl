base_model: Qwen/Qwen2.5-3B-Instruct
plugins:
  - axolotl.integrations.projection_sampling.ProjectionSamplingPlugin

# JSONL rows use role-based messages with an expert assistant reply.
datasets:
  - path: ./expert-traces.jsonl
    ds_type: json
    split: train
    type: chat_template
    roles_to_train: [assistant]

projection_sampling:
  backend: vllm
  backend_kwargs:
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.8
    max_model_len: 8192
    enforce_eager: false
    enable_prefix_caching: true
    score_batch_size: 4
  cache_dir: ./last_run_prepared/projection-sampling
  acceptance: metropolis_hastings
  block_size: 32
  max_new_tokens: 1856
  mcmc_steps: 10
  temperature: 0.6
  device: cuda
  dtype: bfloat16

seed: 42
chat_template: tokenizer_default

adapter: lora
lora_r: 16
lora_alpha: 32
lora_target_linear: true
sequence_len: 4096
sample_packing: true
train_on_inputs: false
val_set_size: 0
micro_batch_size: 1
gradient_accumulation_steps: 16
num_epochs: 2
learning_rate: 0.00005
optimizer: adamw_torch
lr_scheduler: cosine
bf16: true
attn_implementation: sdpa
gradient_checkpointing: true
dataset_prepared_path: ./prepared-datasets/projection-sampling
output_dir: ./outputs/projection-sampling
