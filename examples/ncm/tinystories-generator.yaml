# NCM stage 2: next-concept generator over the frozen stage-1 tokenizer (paper Table 6).
base_model: ./outputs/ncm-tinystories-tokenizer

plugins:
  - axolotl.integrations.ncm.NCMPlugin
ncm:
  stage: generator
  sample_every: 1000

# Generator architecture and objective (NCMGeneratorConfig)
model_config:
  n_layer: 12
  n_head: 12
  n_embd: 768
  dropout: 0.1
  rope_base: 100000
  head_type: tied
  corruption_rate: 0.5

datasets:
  - path: roneneldan/TinyStories
    type: completion
    split: train
val_set_size: 0.001
output_dir: ./outputs/ncm-tinystories-generator

sequence_len: 128
sample_packing: false
pad_to_sequence_len: true

# 2048 sequences per step on one GPU; divide gradient_accumulation_steps by the GPU count.
micro_batch_size: 256
gradient_accumulation_steps: 8
max_steps: 50000

optimizer: adamw_torch_fused
learning_rate: 3.0e-4
lr_scheduler: cosine
cosine_min_lr_ratio: 0.1
warmup_steps: 500
adam_beta2: 0.95
weight_decay: 0.1
max_grad_norm: 1.0

bf16: true
tf32: true

logging_steps: 50
eval_steps: 1000
save_steps: 5000
