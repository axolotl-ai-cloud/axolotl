base_model: meta-models/Muse-Glimmer-30B
processor_type: AutoProcessor

plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin

# The vocabulary is 202,048 tokens, so materialized logits dominate activation memory.
cut_cross_entropy: true

load_in_4bit: true

skip_prepare_dataset: true
remove_unused_columns: false
sample_packing: false

datasets:
  - path: HuggingFaceH4/llava-instruct-mix-vsft
    type: chat_template
    split: train[:1%]
    field_messages: messages

# The template closes turns with <|eot|>, or <|eom|> on reasoning and tool-call turns.
# Without these the terminator is never trained and the model does not learn to stop.
eot_tokens:
  - "<|eot|>"
  - "<|eom|>"

dataset_prepared_path: last_run_prepared
val_set_size: 0.0
output_dir: ./outputs/muse-glimmer-qlora

adapter: qlora
lora_model_dir:

sequence_len: 4096
pad_to_sequence_len: false

lora_r: 32
lora_alpha: 16
lora_dropout: 0.05
# Language model only; the vision tower stays frozen, as it was during Meta's own training.
lora_target_modules: 'model\.language_model\.layers\.\d+\.(self_attn\.(q|k|v|o)_proj|mlp\.(gate|up|down)_proj)'

wandb_project: muse_glimmer
wandb_entity:
wandb_watch:
wandb_name: "qlora"
wandb_log_model:

gradient_accumulation_steps: 4
micro_batch_size: 1
num_epochs: 1
optimizer: adamw_bnb_8bit
lr_scheduler: cosine
learning_rate: 0.0002

bf16: auto
fp16:
tf32: true

gradient_checkpointing: true
logging_steps: 1
attn_implementation: flash_attention_2

warmup_ratio: 0.1
evals_per_epoch: 0
saves_per_epoch: 1
weight_decay: 0.0

# save_first_step: true  # uncomment this to validate checkpoint saving works with your config
