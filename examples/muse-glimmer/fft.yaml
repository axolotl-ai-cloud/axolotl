base_model: meta-models/Muse-Glimmer-30B
processor_type: AutoProcessor

skip_prepare_dataset: true
remove_unused_columns: false
sample_packing: false

datasets:
  - path: HuggingFaceH4/llava-instruct-mix-vsft
    type: chat_template
    split: train[:1%]
    field_messages: messages

# The template closes turns with <|eot|>, or <|eom|> on reasoning and tool-call turns.
# Without these the terminator is never trained and the model does not learn to stop.
eot_tokens:
  - "<|eot|>"
  - "<|eom|>"

dataset_prepared_path: last_run_prepared
val_set_size: 0.0
output_dir: ./outputs/muse-glimmer-fft

sequence_len: 4096
pad_to_sequence_len: false

wandb_project: muse_glimmer
wandb_entity:
wandb_watch:
wandb_name: "fft"
wandb_log_model:

gradient_accumulation_steps: 4
micro_batch_size: 1
num_epochs: 1
optimizer: adamw_torch_fused
lr_scheduler: cosine
learning_rate: 0.00001

bf16: auto
fp16:
tf32: true

gradient_checkpointing: true
logging_steps: 1
attn_implementation: flash_attention_2

warmup_ratio: 0.1
evals_per_epoch: 0
saves_per_epoch: 1
weight_decay: 0.0

# save_first_step: true  # uncomment this to validate checkpoint saving works with your config
