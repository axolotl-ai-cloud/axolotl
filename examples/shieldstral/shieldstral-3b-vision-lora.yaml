base_model: mistralai/Shieldstral-1.0-3B
processor_type: AutoProcessor

# Enable to use mistral-common tokenizer
tokenizer_use_mistral_common: true

plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin

# these 3 lines are needed for now to handle vision chat templates w images
skip_prepare_dataset: true
remove_unused_columns: false
sample_packing: false

# sample dataset below requires downloading image in advance
# wget https://huggingface.co/datasets/Nanobit/text-vision-shieldstral-2k-test/resolve/main/African_elephant.jpg
datasets:
  - path: Nanobit/text-vision-shieldstral-2k-test
    type: chat_template

dataset_prepared_path: last_run_prepared
val_set_size: 0.05
output_dir: ./outputs/shieldstral-vision-lora

adapter: lora
lora_model_dir:

sequence_len: 2048

lora_r: 32
lora_alpha: 16
lora_dropout: 0.0
# language model only, skips the vision tower
lora_target_modules: 'model.language_model.layers.[\d]+.(mlp|self_attn).(up|down|gate|q|k|v|o)_proj'

wandb_project:
wandb_entity:
wandb_watch:
wandb_name:
wandb_log_model:

gradient_accumulation_steps: 1
micro_batch_size: 1
num_epochs: 1
optimizer: adamw_torch_fused
lr_scheduler: cosine
learning_rate: 0.0001

bf16: auto
tf32: false

gradient_checkpointing: true
resume_from_checkpoint:
logging_steps: 1
attn_implementation: flash_attention_2

warmup_ratio: 0.1
evals_per_epoch: 1
saves_per_epoch: 1

# save_first_step: true  # uncomment this to validate checkpoint saving works with your config
