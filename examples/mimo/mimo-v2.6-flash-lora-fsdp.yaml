base_model: XiaomiMiMo/MiMo-V2.6-Flash-RL
trust_remote_code: true

datasets:
  - path: fozziethebeat/alpaca_messages_2k_test
    type: chat_template

dataset_prepared_path: last_run_prepared
val_set_size: 0.1
output_dir: ./outputs/mimo-v2.6-flash-lora-out

adapter: lora
lora_model_dir:

sequence_len: 4096
sample_packing: true

lora_r: 32
lora_alpha: 16
lora_dropout: 0
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

# Uncomment to also target MoE expert weights:
# lora_target_parameters:
#   - mlp.experts.gate_up_proj
#   - mlp.experts.down_proj

wandb_project:
wandb_entity:
wandb_watch:
wandb_name:
wandb_log_model:

gradient_accumulation_steps: 4
micro_batch_size: 1
num_epochs: 1
optimizer: adamw_torch_fused
lr_scheduler: cosine
learning_rate: 0.0002

bf16: auto
tf32: false

resume_from_checkpoint:
logging_steps: 1
# attention sinks and 192/128 q-k/v head dims rule out sdpa and flash_attention_2
attn_implementation: flash_attention_4

warmup_ratio: 0.1
evals_per_epoch: 1
saves_per_epoch: 1

fsdp_version: 2
fsdp_config:
  offload_params: false
  cpu_ram_efficient_loading: true
  auto_wrap_policy: TRANSFORMER_BASED_WRAP
  transformer_layer_cls_to_wrap: MiMoV2FlashDecoderLayer
  state_dict_type: FULL_STATE_DICT
  reshard_after_forward: true
  activation_checkpointing: true
