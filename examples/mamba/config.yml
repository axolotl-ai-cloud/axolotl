base_model: mistralai/Mamba-Codestral-7B-v0.1
# Automatically upload checkpoint and final model to HF
# hub_model_id: username/custom_model_name

datasets:
  - path: mhenrichsen/alpaca_2k_test
    type: alpaca
dataset_prepared_path:
val_set_size: 0.0
output_dir: ./outputs/out

sequence_len: 2048
# packing needs Mamba2 kernels that take seq_idx: the HF Hub builds below, or
# pip install -e .[mamba-ssm]. Mamba1 checkpoints (state-spaces/mamba-*-hf,
# falcon-mamba) cannot pack.
use_kernels: true
sample_packing: true
pad_to_sequence_len: true

wandb_project:
wandb_entity:
wandb_watch:
wandb_name:
wandb_log_model:

gradient_accumulation_steps: 4
micro_batch_size: 1
num_epochs: 2
optimizer: paged_adamw_8bit
lr_scheduler: cosine
learning_rate: 5e-5

train_on_inputs: false
group_by_length: true

bf16: auto
tf32: true

gradient_checkpointing: false
resume_from_checkpoint:
logging_steps: 1

warmup_ratio: 0.1
evals_per_epoch: 4
saves_per_epoch: 1
weight_decay: 0.0
special_tokens:
tokens:

# save_first_step: true  # uncomment this to validate checkpoint saving works with your config
