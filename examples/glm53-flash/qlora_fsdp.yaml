base_model: zai-org/GLM-5.3-Flash-BF16

load_in_4bit: true
quantize_moe_experts: true

datasets:
  - path: fozziethebeat/alpaca_messages_2k_test
    type: chat_template

dataset_prepared_path: last_run_prepared
val_set_size: 0.1
output_dir: ./outputs/glm5.3-flash-qlora-fsdp-out

adapter: qlora
lora_model_dir:

sequence_len: 2048
sample_packing: true

lora_r: 32
lora_alpha: 16
lora_dropout: 0
lora_target_modules:
  - q_a_proj
  - q_b_proj
  - kv_a_proj_with_mqa
  - kv_b_proj
  - q_proj
  - k_proj
  - v_proj
  - o_proj

# Uncomment to also target MoE expert weights:
# lora_target_parameters:
#   - mlp.experts.gate_up_proj
#   - mlp.experts.down_proj

wandb_project:
wandb_entity:
wandb_watch:
wandb_name:
wandb_log_model:

gradient_accumulation_steps: 4
micro_batch_size: 1
num_epochs: 1
optimizer: adamw_torch_8bit
lr_scheduler: cosine
learning_rate: 0.0002

bf16: auto
tf32: false

resume_from_checkpoint:
logging_steps: 1

# the DSA indexer's per-query top-k mask only reaches sdpa or eager
attn_implementation: sdpa

warmup_ratio: 0.1
evals_per_epoch: 1
saves_per_epoch: 1

fsdp_config:
  fsdp_version: 2
  offload_params: false
  cpu_ram_efficient_loading: false
  auto_wrap_policy: TRANSFORMER_BASED_WRAP
  transformer_layer_cls_to_wrap: Glm5NextTextDecoderLayer
  state_dict_type: FULL_STATE_DICT
  sharding_strategy: FULL_SHARD
  reshard_after_forward: true
  activation_checkpointing: true
