base_model: meta-llama/Llama-3.2-1B
# Automatically upload checkpoint and final model to HF
# hub_model_id: username/custom_model_name

plugins:
  - axolotl.integrations.ternary.TernaryPlugin

ternary:
  # target_modules defaults to the llama preset (attention + MLP projections);
  # embeddings, lm_head and norms always stay full precision
  lambda_schedule: linear
  lambda_warmup_steps: 1000
  weight_decay_zero_at: 0.5
  activation_bits: 8
  log_code_flip_every: 100
  export:
    formats:
      - master_bf16
      - hf_bitnet

# healing is continued pretraining: raw text, packed, no instruction masking
pretraining_dataset:
  - path: HuggingFaceFW/fineweb-edu
    name: sample-10BT
    type: pretrain
    split: train
streaming: true

output_dir: ./outputs/ternary-llama-3.2-1b

sequence_len: 2048
sample_packing: true
pad_to_sequence_len: true

gradient_accumulation_steps: 8
micro_batch_size: 8
max_steps: 20000

optimizer: adamw_torch_fused
lr_scheduler: cosine
learning_rate: 1e-4
warmup_steps: 100
weight_decay: 0.01

bf16: true
tf32: true
gradient_checkpointing: true
attn_implementation: flash_attention_2

logging_steps: 1
save_strategy: steps
save_steps: 1000
save_only_model: true

special_tokens:
  pad_token: "<|end_of_text|>"

wandb_project:
wandb_entity:
wandb_watch:
wandb_name:
wandb_log_model:

# save_first_step: true  # uncomment this to validate checkpoint saving works with your config
