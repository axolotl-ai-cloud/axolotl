name: Select test execution mode
description: Honor full-run labels and refresh scheduled baselines on Sundays
inputs:
  cpu:
    description: Honor the CPU-only full-run label
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        TESTMON_CPU: ${{ inputs.cpu }}
      with:
        script: |
          let labels = [];
          if (context.eventName === 'pull_request') {
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: context.payload.pull_request.number,
            });
            labels = pr.labels.map(label => label.name);
          }
          const full = labels.includes('run-tests-full') ||
            (process.env.TESTMON_CPU === 'true' && labels.includes('run-cpu-full'));
          core.exportVariable('TESTMON_FULL', String(full));
          const scheduledSelection = context.eventName === 'schedule' &&
            context.payload.schedule.trim().split(/\s+/)[4] !== '0';
          const select = context.eventName === 'pull_request' || scheduledSelection;
          core.exportVariable('TESTMON_SELECT', String(select));
          core.info(full || !select ? 'Running all eligible tests' : 'Selecting affected tests');
