name: Restore testmon
description: Restore a suite baseline and read current full-run labels
inputs:
  suite:
    description: Environment and suite cache identity
    required: true
  cpu:
    description: Honor the CPU-only full-run label
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        TESTMON_CPU: ${{ inputs.cpu }}
      with:
        script: |
          let labels = [];
          if (context.eventName === 'pull_request') {
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: context.payload.pull_request.number,
            });
            labels = pr.labels.map(label => label.name);
          }
          const full = labels.includes('run-tests-full') ||
            (process.env.TESTMON_CPU === 'true' && labels.includes('run-cpu-full'));
          core.exportVariable('TESTMON_FULL', String(full));
          core.exportVariable('TESTMON_SELECT', String(context.eventName === 'pull_request'));
    - shell: bash
      env:
        TESTMON_SUITE: ${{ inputs.suite }}
      run: |
        rm -rf .testmon
        echo "TESTMON_CACHE_PREFIX=testmon-v1-${TESTMON_SUITE}-" >> "$GITHUB_ENV"
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .testmon
        key: testmon-v1-${{ inputs.suite }}-${{ github.sha }}-
        restore-keys: testmon-v1-${{ inputs.suite }}-
