name: Restore testmon
description: Restore a suite baseline and read current full-run labels
inputs:
  suite:
    description: Environment and suite cache identity
    required: true
  cpu:
    description: Honor the CPU-only full-run label
    default: 'false'
runs:
  using: composite
  steps:
    - uses: ./.github/actions/testmon-selection
      with:
        cpu: ${{ inputs.cpu }}
    - shell: bash
      env:
        TESTMON_SUITE: ${{ inputs.suite }}
      run: |
        rm -rf .testmon
        echo "TESTMON_CACHE_PREFIX=testmon-2.3.0-v1-${TESTMON_SUITE}-" >> "$GITHUB_ENV"
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .testmon
        key: testmon-2.3.0-v1-${{ inputs.suite }}-${{ github.sha }}-
        restore-keys: testmon-2.3.0-v1-${{ inputs.suite }}-
