name: Tests
on:
  # check on push/merge to main, PRs, and manual triggers
  merge_group:
  push:
    branches:
      - "main"
    paths:
      - "**.py"
      - "pyproject.toml"
      - ".github/workflows/*.yml"
      - "cicd/cicd.sh"
      - "cicd/cicd_testmon.sh"
      - "cicd/cicd_cuda_kernels.sh"
      - "cicd/prepare_hf_cache.sh"
      - "cicd/Dockerfile-uv.jinja"
  pull_request:
    # GPU tests are label-gated, so adding the label re-runs this workflow via
    # gpu-label.yml after the initial CPU run has completed.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**.py"
      - "pyproject.toml"
      - ".github/workflows/*.yml"
      - "cicd/cicd.sh"
      - "cicd/cicd_testmon.sh"
      - "cicd/cicd_cuda_kernels.sh"
      - "cicd/prepare_hf_cache.sh"
      - "cicd/Dockerfile-uv.jinja"
  workflow_dispatch:

# Cancel jobs on the same ref if a new one is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

env:
  TRANSFORMERS_IS_CI: "yes"
  UV_SYSTEM_PYTHON: "1"

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip" # caching pip dependencies
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          # check-cli-config-options needs an installed axolotl; the dedicated
          # tests.yml step covers it in CI
          SKIP: no-commit-to-branch,check-cli-config-options

  prime-cdn-s3-cache:
    name: Prefetch S3 once to prime the CDN cache
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 10
    steps:
      - name: Restore Cache from S3
        id: hf-cache-restore-s3
        run: |
          curl -v -H "Range: bytes=0-1023" -L https://axolotl-ci.b-cdn.net/hf-cache.tar.zst > /dev/null

  nf4-distributed:
    name: NF4 distributed CPU
    if: ${{ !github.event.pull_request.draft }}
    needs: [prime-cdn-s3-cache, pre-commit]
    uses: ./.github/workflows/nf4-cpu.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  pytest:
    name: PyTest
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    needs: [prime-cdn-s3-cache, pre-commit]
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        python_version: ["3.12", "3.14"]
        pytorch_version: ["2.13.0", "2.14.0"]
    timeout-minutes: 45
    env:
      AXOLOTL_CI_ENFORCE_GPU_MARKER: "1"

    steps:
      - name: cleanup node
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Cache from S3
        id: hf-cache-restore-s3
        run: |
          mkdir -p ~/.cache/huggingface/hub
          curl -L https://axolotl-ci.b-cdn.net/hf-cache.tar.zst | tar -xpf - -C ~/.cache/huggingface/hub/  --use-compress-program unzstd --strip-components=1
          ls -ltr ~/.cache/huggingface/hub/

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install PyTorch
        run: |
          uv pip install torch==${{ matrix.pytorch_version }} torchvision
          uv pip freeze | grep -E "^(torch|torchvision)==" > /tmp/torch-pin.txt

      - name: Install dependencies
        run: |
          uv pip install --no-build-isolation -e '.[modal,baseten,ringmaster]' --override /tmp/torch-pin.txt
          python scripts/cutcrossentropy_install.py --uv | sh
          uv pip install black mypy pre-commit types-requests quartodoc jupyter blobfile tiktoken \
            codecov codecov-cli pytest pytest-cov pytest-retry pytest-sugar pytest-xdist tbparse

      - name: Make sure PyTorch version wasn't clobbered
        run: |
          python -c "import torch; assert '${{ matrix.pytorch_version }}' in torch.__version__, f'Expected torch ${{ matrix.pytorch_version }} but got {torch.__version__}'"

      - name: Ensure axolotl CLI was installed
        run: |
          axolotl --help

      - name: Check generated CLI config options
        if: ${{ matrix.python_version == '3.14' && matrix.pytorch_version == '2.14.0' }}
        run: |
          axolotl generate-cli-config-options --check

      - name: Pre-Download dataset fixture
        run: |
          hf download --repo-type=dataset axolotl-ai-internal/axolotl-oss-dataset-fixtures

      - name: Show HF cache
        run: hf cache ls

      - name: Run tests
        timeout-minutes: 30
        run: |
          pytest -v --durations=10 -n4 --dist loadfile --ignore=tests/utils/ --ignore=tests/integrations/ --ignore=tests/e2e/ --ignore=tests/patched/ --ignore=tests/cli/ --ignore=tests/monkeypatch/ tests/ --cov=axolotl --cov-report=xml
          pytest -v --durations=10 -m "not slow and not nf4_distributed" tests/monkeypatch/ --cov=axolotl --cov-append --cov-report=xml
          pytest -v --durations=10 tests/patched/ --cov=axolotl --cov-append --cov-report=xml
          pytest -v --durations=10 tests/cli/ --cov=axolotl --cov-append --cov-report=xml
          pytest -v --durations=10 tests/utils/ --cov=axolotl --cov-append --cov-report=xml
          pytest -v --durations=10 \
            --ignore=tests/integrations/kernels/ \
            --ignore=tests/integrations/monkeypatch/test_tiled_mlp_moe.py \
            --ignore=tests/integrations/test_gemma4_moe.py \
            --ignore=tests/integrations/test_scattermoe_lora.py \
            --ignore=tests/integrations/test_scattermoe_lora_kernels.py \
            --ignore=tests/integrations/test_scattermoe_multi_lora.py \
            --ignore=tests/integrations/test_sonicmoe_multi_lora.py \
            tests/integrations/ --cov=axolotl --cov-append --cov-report=xml

      - name: Show HF cache
        run: hf cache ls

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests,pytorch-${{ matrix.pytorch_version }}
          fail_ci_if_error: false

  pytest-testmon:
    if: ${{ !github.event.pull_request.draft }}
    needs: [prime-cdn-s3-cache, pre-commit]
    uses: ./.github/workflows/testmon-cpu.yml

  sdist:
    name: SDist manifest and install
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    needs: [prime-cdn-s3-cache, pre-commit]
    timeout-minutes: 45
    env:
      PYTORCH_VERSION: "2.14.0"

    steps:
      - name: cleanup node
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Cache from S3
        id: hf-cache-restore-s3
        run: |
          mkdir -p ~/.cache/huggingface/hub
          curl -L https://axolotl-ci.b-cdn.net/hf-cache.tar.zst | tar -xpf - -C ~/.cache/huggingface/hub/  --use-compress-program unzstd --strip-components=1
          ls -ltr ~/.cache/huggingface/hub/

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Check sdist manifest
        run: |
          python scripts/check_sdist_manifest.py --out-dir dist

      - name: Install PyTorch
        run: |
          uv pip install torch==${PYTORCH_VERSION} torchvision
          uv pip freeze | grep -E "^(torch|torchvision)==" > /tmp/torch-pin.txt

      - name: Install axolotl from the sdist-built wheel
        run: |
          wheel=$(ls dist/axolotl-*.whl)
          uv pip install --no-build-isolation "${wheel}[modal,baseten,ringmaster]" --override /tmp/torch-pin.txt
          python scripts/cutcrossentropy_install.py --uv | sh
          uv pip install pytest pytest-retry pytest-sugar pytest-xdist tbparse

      - name: Make sure PyTorch version wasn't clobbered
        run: |
          python -c "import torch; assert '${PYTORCH_VERSION}' in torch.__version__, f'Expected torch ${PYTORCH_VERSION} but got {torch.__version__}'"

      - name: Ensure axolotl CLI was installed
        run: axolotl --help

      - name: Check generated CLI config options
        run: axolotl generate-cli-config-options --check

      - name: Verify agent docs are discoverable
        run: |
          # Agent docs live in docs/agents/ (source of truth) and are resolved
          # at runtime from the repo checkout or via `axolotl fetch docs`
          axolotl agent-docs --list
          axolotl agent-docs | grep -q "Fine-tuning framework"
          axolotl agent-docs grpo | grep -q "GRPO"
          axolotl agent-docs sft | grep -q "SFT"
          python -c "from axolotl.cli.agent_docs import get_doc, list_topics; assert len(list_topics()) >= 5; assert 'GRPO' in get_doc('grpo')"

      - name: Import every axolotl module and resolve entry points
        env:
          AXOLOTL_DO_NOT_TRACK: "1"
        run: |
          python scripts/check_installed_axolotl.py --import-walk --entry-points --require-site-packages

      - name: Pre-Download dataset fixture
        run: |
          hf download --repo-type=dataset axolotl-ai-internal/axolotl-oss-dataset-fixtures

      - name: Run CLI tests against the installed wheel
        timeout-minutes: 20
        run: |
          pytest -v --durations=10 tests/cli/

  multigpu-paths:
    name: Multi-GPU path filter
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    outputs:
      run_multigpu: ${{ steps.filter.outputs.run_multigpu }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: filter
        with:
          script: |
            // trailing '/' = prefix, '*' = glob within one path segment, otherwise exact path
            const PATTERNS = [
              'src/axolotl/core/',
              'src/axolotl/loaders/',
              'src/axolotl/model_support/',
              'src/axolotl/monkeypatch/',
              'src/axolotl/kernels/',
              'src/axolotl/utils/distributed.py',
              'src/axolotl/utils/schemas/',
              'src/axolotl/utils/model_shard_quant.py',
              'src/axolotl/integrations/expert_parallel/',
              'src/axolotl/integrations/context_parallel/',
              'src/axolotl/integrations/cut_cross_entropy/',
              'src/axolotl/integrations/kernels/',
              'src/axolotl/train.py',
              'src/axolotl/cli/',
              'deepspeed_configs/',
              'tests/e2e/multigpu/',
              'cicd/',
              '.github/workflows/multi-gpu-e2e*.yml',
              '.github/workflows/tests.yml',
              'pyproject.toml',
              'requirements*.txt',
              'scripts/cutcrossentropy_install.py',
              'cicd/Dockerfile*',
            ];
            if (context.eventName !== 'pull_request') {
              core.info(`event ${context.eventName}: multigpu enabled`);
              core.setOutput('run_multigpu', 'true');
              return;
            }
            const escape = (s) => s.replace(/[.+?^${}()|[\]\\]/g, '\\$&');
            const toRegex = (p) => new RegExp('^' + p.split('*').map(escape).join('[^/]*') + '$');
            const matches = (file) => PATTERNS.some((p) =>
              p.endsWith('/') ? file.startsWith(p) : p.includes('*') ? toRegex(p).test(file) : file === p);
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const hits = files.map((f) => f.filename).filter(matches);
            core.info(`${files.length} changed file(s); ${hits.length} matched multigpu paths`);
            for (const hit of hits) core.info(`  ${hit}`);
            core.setOutput('run_multigpu', String(hits.length > 0));

  check-gpu-label:
    # Deferred so a label added while CPU jobs run is seen without a rerun
    needs: [pre-commit, nf4-distributed, pytest, sdist]
    uses: ./.github/workflows/gpu-pr-gate.yml

  docker-e2e:
    needs: [pre-commit, nf4-distributed, pytest, sdist, check-gpu-label]
    if: needs.check-gpu-label.outputs.enabled == 'true'
    uses: ./.github/workflows/docker-e2e.yml
    secrets: inherit

  multi-gpu-e2e:
    needs: [pre-commit, nf4-distributed, pytest, sdist, check-gpu-label, multigpu-paths]
    if: github.event_name == 'pull_request' && needs.check-gpu-label.outputs.enabled == 'true' && needs.multigpu-paths.outputs.run_multigpu == 'true'
    uses: ./.github/workflows/multi-gpu-e2e.yml
    secrets: inherit
