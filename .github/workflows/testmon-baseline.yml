name: testmon-baseline

# Main commits mostly land with [skip ci], so the baselines are refreshed here instead.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main-changed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
      cpu: ${{ steps.check.outputs.cpu }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: check
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('run', 'true');
              core.setOutput('cpu', 'true');
              return;
            }
            const { data: commit } = await github.rest.repos.getCommit({ ...context.repo, ref: 'main' });
            const committed = new Date(commit.commit.committer.date);
            const ageHours = (Date.now() - committed.getTime()) / 3600000;
            core.info(`main head ${commit.sha} committed ${ageHours.toFixed(1)}h ago`);
            core.setOutput('run', String(ageHours < 24));
            // The CPU baseline is cached per cell and commit, so refresh whenever main's head lacks
            // one: [skip ci] or path-filtered pushes, cancelled runs and evicted caches all leave gaps.
            // A failed lookup refreshes anyway; failing this job would also skip single-gpu.
            // The cells of testmon-cpu.yml's matrix on main:
            const cells = ['py3.14.9-torch2.14.1', 'py3.12.16-torch2.13.0', 'py3.14.9-torch2.15.0'];
            try {
              const caches = await github.paginate(github.rest.actions.getActionsCacheList, {
                ...context.repo,
                key: 'testmon-cpu-py',
                ref: 'refs/heads/main',
                per_page: 100,
              });
              const keys = new Set(caches.map((c) => c.key));
              const missing = cells.filter((cell) => !keys.has(`testmon-cpu-${cell}-${commit.sha}`));
              core.info(`testmon-cpu baselines missing for ${commit.sha}: ${missing.join(', ') || 'none'}`);
              core.setOutput('cpu', String(missing.length > 0));
            } catch (error) {
              core.warning(`testmon-cpu cache lookup failed, refreshing anyway: ${error.message}`);
              core.setOutput('cpu', 'true');
            }

  cpu:
    needs: main-changed
    if: needs.main-changed.outputs.cpu == 'true'
    uses: ./.github/workflows/testmon-cpu.yml

  single-gpu:
    needs: main-changed
    if: github.repository_owner == 'axolotl-ai-cloud' && needs.main-changed.outputs.run == 'true'
    runs-on: [self-hosted, modal]
    timeout-minutes: 120
    env:
      TRANSFORMERS_IS_CI: "yes"
      UV_SYSTEM_PYTHON: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda: 130
            cuda_version: 13.0.3
            python_version: "3.14"
            pytorch: 2.14.1
            num_gpus: 1
            axolotl_extras:
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Modal
        run: |
          python -m pip install --upgrade pip
          pip install modal==1.6.3 jinja2
      - name: Update env vars
        run: |
          echo "BASE_TAG=main-base-py${{ matrix.python_version }}-cu${{ matrix.cuda }}-${{ matrix.pytorch }}" >> $GITHUB_ENV
          echo "PYTORCH_VERSION=${{ matrix.pytorch}}" >> $GITHUB_ENV
          echo "AXOLOTL_ARGS=${{ matrix.axolotl_args}}" >> $GITHUB_ENV
          echo "AXOLOTL_EXTRAS=${{ matrix.axolotl_extras}}" >> $GITHUB_ENV
          echo "CUDA=${{ matrix.cuda }}" >> $GITHUB_ENV
          echo "MODAL_IMAGE_BUILDER_VERSION=2026.10" >> $GITHUB_ENV
          echo "N_GPUS=${{ matrix.num_gpus }}" >> $GITHUB_ENV
          echo "GPU_TYPE=${{ matrix.gpu_type || 'L40S'}}" >> $GITHUB_ENV
          echo "E2E_DOCKERFILE=${{ matrix.dockerfile || 'Dockerfile-uv.jinja'}}" >> $GITHUB_ENV
      - name: Compute deps hash
        run: python cicd/deps_hash.py
      - name: Run testmon e2e job on Modal
        run: |
          modal run -m cicd.e2e_testmon
