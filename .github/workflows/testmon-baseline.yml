name: testmon-baseline

# Main commits mostly land with [skip ci], so the baselines are refreshed here instead.
on:
  schedule:
    - cron: "0 3 * * 0"
    - cron: "0 3 * * 1-6"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  main-changed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      cpu: ${{ steps.check.outputs.cpu }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: check
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('cpu', 'true');
              return;
            }
            const { data: commit } = await github.rest.repos.getCommit({ ...context.repo, ref: 'main' });
            // The CPU baseline is cached per cell and commit, so refresh whenever main's head lacks
            // one: [skip ci] or path-filtered pushes, cancelled runs and evicted caches all leave gaps.
            // A failed lookup refreshes anyway.
            // The cells of testmon-cpu.yml's matrix on main:
            const cells = ['py3.14.9-torch2.14.1', 'py3.12.16-torch2.13.0', 'py3.14.9-torch2.15.0'];
            try {
              const caches = await github.paginate(github.rest.actions.getActionsCacheList, {
                ...context.repo,
                key: 'testmon-2.3.0-cpu-py',
                ref: 'refs/heads/main',
                per_page: 100,
              });
              const keys = caches.map((c) => c.key);
              const missing = cells.filter((cell) => !keys.some(key => key === `testmon-2.3.0-cpu-${cell}-${commit.sha}` || key.startsWith(`testmon-2.3.0-cpu-${cell}-${commit.sha}-`)));
              core.info(`testmon-cpu baselines missing for ${commit.sha}: ${missing.join(', ') || 'none'}`);
              core.setOutput('cpu', String(missing.length > 0));
            } catch (error) {
              core.warning(`testmon-cpu cache lookup failed, refreshing anyway: ${error.message}`);
              core.setOutput('cpu', 'true');
            }

  cpu:
    needs: main-changed
    if: needs.main-changed.outputs.cpu == 'true'
    uses: ./.github/workflows/testmon-cpu.yml

  gpu-kernels:
    if: github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0'
    uses: ./.github/workflows/testmon-gpu-kernels.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    if: github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0'
    uses: ./.github/workflows/testmon-e2e-baseline.yml

  blackwell:
    if: github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0'
    uses: ./.github/workflows/testmon-blackwell.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
