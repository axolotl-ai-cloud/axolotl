name: docker-multigpu-tests-biweekly-jobs

on:
  workflow_call:

# Enter concurrency only after the caller's label gate passes.
concurrency:
  group: docker-multigpu-tests-biweekly-${{ github.ref }}-e2e
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  MODAL_IMAGE_BUILDER_VERSION: "2025.06"

jobs:
  test-axolotl-multigpu:
    if: github.repository_owner == 'axolotl-ai-cloud'
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda: 130
            cuda_version: 13.0.0
            python_version: "3.12"
            pytorch: 2.13.0
            axolotl_extras:
            num_gpus: 2
            test_suite: multigpu
          - cuda: 130
            cuda_version: 13.0.0
            python_version: "3.12"
            pytorch: 2.13.0
            axolotl_extras:
            num_gpus: 2
            gpu_type: B200
            test_suite: nvfp4
          - cuda: 130
            cuda_version: 13.0.0
            python_version: "3.12"
            pytorch: 2.14.0
            axolotl_extras:
            num_gpus: 2
            test_suite: multigpu
          - cuda: 130
            python_version: "3.12"
            pytorch: 2.13.0
            num_gpus: 3
            test_suite: nf4
            nf4_test_stack: pinned
    name: ${{ matrix.test_suite }} (${{ matrix.nf4_test_stack || 'default' }} ${{ matrix.pytorch }}-cu${{ matrix.cuda }})
    runs-on: [self-hosted, modal]
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Modal
        run: |
          python -m pip install --upgrade pip
          pip install modal==1.3.0.post1 jinja2
      - name: Update env vars
        run: |
          echo "BASE_TAG=main-base-py${{ matrix.python_version }}-cu${{ matrix.cuda }}-${{ matrix.pytorch }}" >> $GITHUB_ENV
          echo "PYTORCH_VERSION=${{ matrix.pytorch}}" >> $GITHUB_ENV
          echo "AXOLOTL_ARGS=${{ matrix.axolotl_args}}" >> $GITHUB_ENV
          echo "AXOLOTL_EXTRAS=${{ matrix.axolotl_extras}}" >> $GITHUB_ENV
          echo "CUDA=${{ matrix.cuda }}" >> $GITHUB_ENV
          echo "N_GPUS=${{ matrix.num_gpus }}" >> $GITHUB_ENV
          echo "GPU_TYPE=${{ matrix.gpu_type || 'H100' }}" >> $GITHUB_ENV
          echo "MULTIGPU_TEST_SUITE=${{ matrix.test_suite }}" >> $GITHUB_ENV
          echo "NF4_TEST_STACK=${{ matrix.nf4_test_stack }}" >> $GITHUB_ENV
          echo "E2E_DOCKERFILE=${{ matrix.dockerfile || 'Dockerfile-uv.jinja'}}" >> $GITHUB_ENV
      - name: Compute deps hash
        run: |
          deps_hash=$(
            {
              cat pyproject.toml scripts/cutcrossentropy_install.py cicd/Dockerfile-uv.jinja
              if [ -n "${E2E_DOCKERFILE:-}" ] && [ "$E2E_DOCKERFILE" != "Dockerfile-uv.jinja" ]; then
                cat "cicd/$E2E_DOCKERFILE"
              fi
              echo "extras=${AXOLOTL_EXTRAS:-} args=${AXOLOTL_ARGS:-} base=${BASE_TAG:-}"
              if [ "${NIGHTLY_BUILD:-}" = "true" ]; then
                date -u +%F
              fi
            } | sha256sum | cut -c1-16
          )
          echo "DEPS_HASH=${deps_hash}" >> "$GITHUB_ENV"
          echo "DEPS_HASH=${deps_hash}"
      - name: Run tests job on Modal
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          modal run -m cicd.multigpu
