name: Distributed CPU

on:
  workflow_call:
    inputs:
      slow:
        type: boolean
        default: false
      nightly:
        type: boolean
        default: false
      python_pytorch_matrix:
        type: string
        default: '[{"python_version":"3.12.16","pytorch_version":"2.13.0"},{"python_version":"3.14.9","pytorch_version":"2.14.1"},{"python_version":"3.14.9","pytorch_version":"2.15.0"}]'
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: read

env:
  TRANSFORMERS_IS_CI: "yes"
  UV_SYSTEM_PYTHON: "1"
  DS_ACCELERATOR: "cpu"
  COVERAGE_CORE: "sysmon"
  TESTMON_SUBPROCESSES: "true"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  distributed-cpu:
    name: ${{ inputs.slow && 'Slow CPU' || 'Distributed CPU' }} / ${{ inputs.nightly && 'nightly' || 'pinned' }} / PyTorch ${{ matrix.pytorch_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.python_pytorch_matrix) }}
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore Cache from S3
        run: |
          mkdir -p ~/.cache/huggingface/hub
          curl -L https://axolotl-ci.b-cdn.net/hf-cache.tar.zst | tar -xpf - -C ~/.cache/huggingface/hub/  --use-compress-program unzstd --strip-components=1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python_version }}
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install dependencies
        run: |
          uv pip install torch==${{ matrix.pytorch_version }} torchvision
          uv pip freeze | grep -E "^(torch|torchvision)==" > /tmp/torch-pin.txt
          uv pip install -e '.[ringmaster]' --override /tmp/torch-pin.txt
          python scripts/cutcrossentropy_install.py --uv | sh
          uv pip install pytest==9.1.1 pytest-cov pytest-xdist pytest-testmon==2.3.0
      - name: Override with nightly HF packages
        if: inputs.nightly
        run: |
          uv pip install --no-deps \
            "kernels @ git+https://github.com/huggingface/kernels.git@main#subdirectory=kernels" \
            "transformers @ git+https://github.com/huggingface/transformers.git@main" \
            "peft @ git+https://github.com/huggingface/peft.git@main" \
            "accelerate @ git+https://github.com/huggingface/accelerate.git@main" \
            "trl @ git+https://github.com/huggingface/trl.git@main" \
            "datasets @ git+https://github.com/huggingface/datasets.git@main"
      - name: Report dependency versions
        run: |
          python - <<'PY'
          from importlib.metadata import version
          for name in ("torch", "transformers", "accelerate", "torchao", "bitsandbytes", "peft"):
              print(f"{name}=={version(name)}", flush=True)
          PY
          python -c "import torch; assert '${{ matrix.pytorch_version }}' in torch.__version__, torch.__version__"
      - name: Restore testmon
        uses: ./.github/actions/testmon-restore
        with:
          cpu: 'true'
          suite: ${{ inputs.slow && 'cpu-slow' || 'distributed-cpu' }}-py${{ matrix.python_version }}-torch${{ matrix.pytorch_version }}-${{ inputs.nightly && 'nightly' || 'pinned' }}
      - name: Run fast NF4 compatibility checks
        if: ${{ !inputs.slow }}
        run: |
          pytest -v --durations=10 -n0 -m "not slow and not nf4_distributed" \
            --confcutdir=tests/monkeypatch tests/monkeypatch/test_nf4_loading.py \
            --junitxml=nf4-compat-junit.xml \
            --cov=axolotl --cov-report=xml:distributed-cpu-coverage.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          report = ET.parse("nf4-compat-junit.xml")
          assert list(report.iter("testcase")), "No NF4 compatibility tests ran"
          assert not list(report.iter("skipped")), "NF4 compatibility tests must not skip"
          PY
      - name: Run NF4 distributed CPU tests
        if: ${{ !inputs.slow }}
        run: |
          python cicd/pytest_testmon.py -v --durations=10 -n0 -m nf4_distributed \
            --confcutdir=tests/monkeypatch tests/monkeypatch/test_nf4_loading.py \
            --cov=axolotl --cov-append --cov-report=xml:distributed-cpu-coverage.xml
      - name: Run distributed checkpoint and optimizer tests
        if: ${{ !inputs.slow }}
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: |
          python cicd/pytest_testmon.py -v --durations=10 -n0 -m "distributed_cpu and not gpu and not slow" \
            tests/monkeypatch/test_fsdp2_full_checkpoint.py \
            tests/monkeypatch/test_fsdp2_sharded_adapter.py \
            tests/monkeypatch/test_fsdp2_bnb_checkpoint.py \
            tests/monkeypatch/test_fsdp2_mixed_dtype_groups.py \
            tests/monkeypatch/test_lora_merge_aware_distributed.py \
            tests/monkeypatch/test_fsdp2_fused_lm_head_distributed.py \
            tests/integrations/test_expert_parallel_bnb.py \
            tests/integrations/expert_parallel/test_ep_checkpoint_resume.py \
            tests/integrations/expert_parallel/test_ep_lora_adapter_save_distributed.py \
            --cov=axolotl --cov-config=.coveragerc-distributed \
            --cov-append --cov-report=xml:distributed-cpu-coverage.xml
      - name: Run other distributed CPU tests
        if: ${{ !inputs.slow }}
        run: |
          python cicd/pytest_testmon.py -v --durations=10 -n0 -m "distributed_cpu and not slow" \
            tests/integrations/expert_parallel/test_ep_cpu_offload_grad_clip.py \
            tests/integrations/expert_parallel/test_torch_backend.py \
            tests/integrations/expert_parallel/test_plugin.py \
            tests/integrations/expert_parallel/test_nvfp4_wrap.py \
            tests/integrations/test_context_parallel_glm_dsa_cp.py \
            tests/integrations/context_parallel/test_mesh.py \
            tests/core/trainers/diffusion_lm/test_full_sequence.py \
            tests/core/test_checkpoint_mirror_dist.py \
            tests/core/test_async_scoring_two_rank.py \
            --cov=axolotl --cov-append --cov-report=xml:distributed-cpu-coverage.xml
      - name: Run slow CPU integrations
        if: inputs.slow
        run: |
          python cicd/pytest_testmon.py -v --durations=10 -n0 -m "slow and not gpu" \
            --ignore=tests/integrations/kernels/ tests/integrations/ \
            --cov=axolotl --cov-report=xml:distributed-cpu-coverage.xml
      - name: Save testmon
        if: ${{ !cancelled() }}
        uses: ./.github/actions/testmon-save
        with:
          suite: ${{ inputs.slow && 'cpu-slow' || 'distributed-cpu' }}-py${{ matrix.python_version }}-torch${{ matrix.pytorch_version }}-${{ inputs.nightly && 'nightly' || 'pinned' }}
      - name: Upload coverage
        if: env.TESTMON_FULL == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./distributed-cpu-coverage.xml
          flags: ${{ inputs.slow && 'cpu-slow' || 'distributed-cpu' }},${{ inputs.nightly && 'nightly' || 'pinned' }},pytorch-${{ matrix.pytorch_version }}
          fail_ci_if_error: false
