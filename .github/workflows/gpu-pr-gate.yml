name: GPU PR gate

on:
  workflow_call:
    outputs:
      enabled:
        value: ${{ jobs.check.outputs.enabled }}

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.label.outputs.enabled }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: label
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('enabled', 'true');
              return;
            }
            // A rerun retains the event's original labels and draft state.
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.payload.pull_request.number,
            });
            const enabled = pr.state === 'open' && !pr.draft &&
              pr.head.sha === context.payload.pull_request.head.sha &&
              pr.labels.some(label => label.name === 'run-gpu-tests');
            core.setOutput('enabled', String(enabled));
