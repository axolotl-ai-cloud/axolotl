name: publish tree-recurrence

# Inert until the PyPI project's trusted publisher exists: it runs only for a
# tree-recurrence/v<version> tag, which pypi.yml's "v*" filter does not match.
on:
  push:
    tags:
      - "tree-recurrence/v*"

permissions: {}

jobs:
  build:
    name: Build tree-recurrence
    runs-on: ubuntu-latest
    if: github.repository == 'axolotl-ai-cloud/axolotl'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Check the tag matches VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(cat packages/tree-recurrence/VERSION)"
          if [ "${TAG#tree-recurrence/v}" != "$version" ]; then
            echo "tag $TAG does not match packages/tree-recurrence/VERSION ($version)"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build packages/tree-recurrence --out-dir dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tree-recurrence-dist
          path: dist/

  publish:
    name: Upload tree-recurrence to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: pypi-tree-recurrence
      url: https://pypi.org/p/tree-recurrence
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tree-recurrence-dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
