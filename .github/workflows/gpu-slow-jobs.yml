name: Slow GPU jobs

on:
  workflow_call:

permissions:
  contents: read

env:
  MODAL_IMAGE_BUILDER_VERSION: "2025.06"

jobs:
  gpu-slow:
    if: github.repository_owner == 'axolotl-ai-cloud'
    name: ${{ matrix.test_suite }} (${{ matrix.num_gpus }} H100)
    runs-on: [self-hosted, modal]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda: 130
            python_version: "3.14"
            pytorch: "2.14.0"
            test_suite: gpu_slow_kernels
            num_gpus: 1
          - cuda: 130
            python_version: "3.14"
            pytorch: "2.14.0"
            test_suite: gpu_slow_distributed
            num_gpus: 2
          - cuda: 130
            python_version: "3.14"
            pytorch: "2.14.0"
            test_suite: gpu_slow_four_rank
            num_gpus: 4
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python_version }}
      - name: Install Modal
        run: |
          python -m pip install --upgrade pip
          pip install modal==1.3.0.post1 jinja2
      - name: Update env vars
        run: |
          echo "BASE_TAG=main-base-py${{ matrix.python_version }}-cu${{ matrix.cuda }}-${{ matrix.pytorch }}" >> $GITHUB_ENV
          echo "PYTORCH_VERSION=${{ matrix.pytorch}}" >> $GITHUB_ENV
          echo "AXOLOTL_ARGS=" >> $GITHUB_ENV
          echo "AXOLOTL_EXTRAS=" >> $GITHUB_ENV
          echo "CUDA=${{ matrix.cuda }}" >> $GITHUB_ENV
          echo "N_GPUS=${{ matrix.num_gpus }}" >> $GITHUB_ENV
          echo "GPU_TYPE=H100" >> $GITHUB_ENV
          echo "MULTIGPU_TEST_SUITE=${{ matrix.test_suite }}" >> $GITHUB_ENV
          echo "E2E_DOCKERFILE=Dockerfile-uv.jinja" >> $GITHUB_ENV
      - name: Compute deps hash
        run: python cicd/deps_hash.py
      - name: Run tests job on Modal
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          modal run -m cicd.multigpu
