name: Preview
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

    # Run the workflow only when one of these files changes. src/axolotl is
    # included because quartodoc renders API docs from the whole package —
    # removing a module it tracks breaks the build (see _quarto.yml sections)
    paths:
      - '**/*.md'      # any Markdown file
      - '**/*.qmd'     # any Quarto file
      - '_quarto.yml'
      - 'docs/**'
      - 'src/axolotl/**.py'
      - .github/workflows/preview-docs.yml
      - '!packages/tree-recurrence/**'  # not part of the docs site

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: '1.11.9'

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: |
            docs/requirements.txt
            .github/workflows/preview-docs.yml

      - name: Install docs dependencies
        run: |
          uv pip install --system 'torch>=2.13.0,<2.16.0' --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system -r docs/requirements.txt

      - name: Build autodoc
        id: autodoc
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/autodoc"
          quartodoc build 2>&1 | tee "$RUNNER_TEMP/autodoc/quartodoc-build.log"

      # griffe docstring warnings don't fail the build; surface them on the PR instead.
      # Both steps also report a failed build: once the build step ran, tee created the log.
      - name: Annotate docstring warnings
        if: ${{ !cancelled() && steps.autodoc.outcome != 'skipped' }}
        run: python3 docs/scripts/annotate_autodoc_warnings.py "$RUNNER_TEMP/autodoc/quartodoc-build.log"

      - name: Upload autodoc log
        if: ${{ !cancelled() && steps.autodoc.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autodoc-log
          path: ${{ runner.temp }}/autodoc/quartodoc-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Quarto render
        run: python3 docs/scripts/render_docs.py --jobs 4

      # everything above runs credential-free on every PR (including forks) so
      # a broken docs build fails CI; publishing needs the Netlify secrets,
      # which only same-repo branches get
      - name: Netlify Publish
        uses: nwtgck/actions-netlify@d22a32a27c918fe470bbc562e984f80ec48c2668 # v4.0.0
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        id: netlify
        with:
          publish-dir: './_site'
          enable-pull-request-comment: false
          enable-github-deployment: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deployed On Netlify"
          github-deployment-environment: 'preview'
          github-deployment-description: 'Preview Deployment'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Update PR with preview link
        if: ${{ steps.netlify.outcome == 'success' }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          message: |
            📖 **Documentation Preview**: ${{ steps.netlify.outputs.deploy-url }}

            Deployed on Netlify from commit ${{ github.event.pull_request.head.sha }}
