name: docker-e2e-tests

on:
  merge_group:
  push:
    branches:
      - "main"
    paths:
      - "**.py"
      - "pyproject.toml"
      - ".github/workflows/*.yml"
      - "cicd/cicd.sh"
      - "cicd/cicd_cuda_kernels.sh"
      - "cicd/prepare_hf_cache.sh"
      - "cicd/Dockerfile-uv.jinja"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**.py"
      - "pyproject.toml"
      - ".github/workflows/*.yml"
      - "cicd/cicd.sh"
      - "cicd/cicd_cuda_kernels.sh"
      - "cicd/prepare_hf_cache.sh"
      - "cicd/Dockerfile-uv.jinja"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  check-gpu-label:
    uses: ./.github/workflows/gpu-pr-gate.yml

  run-e2e:
    needs: check-gpu-label
    if: needs.check-gpu-label.outputs.enabled == 'true'
    uses: ./.github/workflows/docker-e2e-jobs.yml
    secrets: inherit
