name: docker-multigpu-tests-biweekly

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - "tests/e2e/multigpu/**.py"
      - "tests/monkeypatch/test_nf4_loading.py"
      - "cicd/multigpu.py"
      - "cicd/multigpu.sh"
      - "cicd/nf4.sh"
      - "cicd/nvfp4.sh"
      - "cicd/Dockerfile*.jinja"
      - "src/axolotl/loaders/**.py"
      - "src/axolotl/utils/nf4.py"
      - "src/axolotl/utils/nf4_loading.py"
      - "src/axolotl/utils/schemas/**.py"
      - "src/axolotl/monkeypatch/accelerate/**.py"
      - "src/axolotl/monkeypatch/bnb_large_tensors.py"
      - "src/axolotl/monkeypatch/moe_quant.py"
      - "src/axolotl/monkeypatch/peft/**.py"
      - "src/axolotl/monkeypatch/torchao*.py"
      - "src/axolotl/cli/merge_lora.py"
      - "src/axolotl/cli/utils/lora_merge.py"
      - "src/axolotl/integrations/kernels/libs/scattermoe_lora/**.py"
      - "src/axolotl/integrations/kernels/libs/sonicmoe/**.py"
      - "src/axolotl/integrations/kernels/merge_aware*.py"
      - "src/axolotl/integrations/expert_parallel/**.py"
      - "src/axolotl/core/trainers/base.py"
      - "src/axolotl/core/trainers/mixins/distributed_parallel.py"
      - "src/axolotl/train.py"
      - "src/axolotl/utils/gradient_clipping.py"
      - "src/axolotl/cli/utils/native_nvfp4_merge.py"
      - "pyproject.toml"
      - ".github/workflows/multi-gpu-e2e.yml"
      - ".github/workflows/multi-gpu-e2e-jobs.yml"
      - "scripts/cutcrossentropy_install.py"
      - "src/axolotl/core/trainers/mixins/sequence_parallel.py"
      - "src/axolotl/utils/distributed.py"
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1,4" # Runs at 00:00 UTC every monday & thursday

permissions:
  contents: read

jobs:
  run-multigpu:
    if: >
      github.event_name != 'pull_request' ||
      (
        !github.event.pull_request.draft &&
        contains(github.event.pull_request.labels.*.name, 'run-gpu-tests') &&
        (github.event.action != 'labeled' || github.event.label.name == 'run-gpu-tests')
      )
    uses: ./.github/workflows/multi-gpu-e2e-jobs.yml
    secrets: inherit
