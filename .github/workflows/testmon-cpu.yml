name: testmon-cpu

on:
  workflow_call:
    inputs:
      refresh:
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

env:
  TRANSFORMERS_IS_CI: "yes"
  UV_SYSTEM_PYTHON: "1"

jobs:
  pytest-testmon:
    name: PyTest testmon (py${{ matrix.python_version }}, torch ${{ matrix.pytorch_version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Exact patch: testmon re-runs everything when the Python micro version changes.
      matrix:
        include:
          - python_version: "3.12.16"
            pytorch_version: "2.13.0"
          - python_version: "3.14.9"
            pytorch_version: "2.14.1"
          - python_version: "3.14.9"
            pytorch_version: "2.15.0"
    env:
      AXOLOTL_CI_ENFORCE_GPU_MARKER: "1"
      PYTHON_VERSION: ${{ matrix.python_version }}
      PYTORCH_VERSION: ${{ matrix.pytorch_version }}

    steps:
      - name: cleanup node
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Cache from S3
        id: hf-cache-restore-s3
        run: |
          mkdir -p ~/.cache/huggingface/hub
          curl -L https://axolotl-ci.b-cdn.net/hf-cache.tar.zst | tar -xpf - -C ~/.cache/huggingface/hub/  --use-compress-program unzstd --strip-components=1
          ls -ltr ~/.cache/huggingface/hub/

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install PyTorch
        run: |
          uv pip install torch==${PYTORCH_VERSION} torchvision
          uv pip freeze | grep -E "^(torch|torchvision)==" > /tmp/torch-pin.txt

      - name: Install dependencies
        run: |
          uv pip install -e '.[modal,baseten,ringmaster]' --override /tmp/torch-pin.txt
          python scripts/cutcrossentropy_install.py --uv | sh
          uv pip install black mypy pre-commit types-requests quartodoc jupyter blobfile tiktoken \
            codecov-cli pytest==9.1.1 pytest-retry pytest-sugar pytest-testmon==2.2.0 pytest-xdist tbparse

      - name: Make sure PyTorch version wasn't clobbered
        run: |
          python -c "import torch; assert '${PYTORCH_VERSION}' in torch.__version__, f'Expected torch ${PYTORCH_VERSION} but got {torch.__version__}'"

      - name: Ensure axolotl CLI was installed
        run: |
          axolotl --help

      - name: Check generated CLI config options
        if: ${{ matrix.python_version == '3.14.9' && matrix.pytorch_version == '2.14.1' }}
        run: axolotl generate-cli-config-options --check

      - name: Read CPU test selection
        id: selection
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            let full = false;
            if (context.eventName === 'pull_request') {
              const { data: pr } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: context.payload.pull_request.number,
              });
              full = pr.labels.some(label => ['run-cpu-full', 'run-tests-full'].includes(label.name));
            }
            core.setOutput('full', String(full));
            core.info(full ? 'Running the full CPU suite' : 'Selecting CPU tests with testmon');

      - name: Pre-Download dataset fixture
        run: |
          hf download --repo-type=dataset axolotl-ai-internal/axolotl-oss-dataset-fixtures

      - name: Show HF cache
        run: hf cache ls

      # One cache key per Python/torch cell, so cells never restore or claim each other's baseline
      - name: Restore testmon baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .testmon
          key: testmon-cpu-py${{ env.PYTHON_VERSION }}-torch${{ env.PYTORCH_VERSION }}-${{ github.sha }}-
          restore-keys: |
            testmon-cpu-py${{ env.PYTHON_VERSION }}-torch${{ env.PYTORCH_VERSION }}-

      - name: Run tests with testmon selection (xdist -n4 kept, pytest-testmon 2.2.0 syncs workers)
        id: testmon
        timeout-minutes: 30
        shell: bash
        env:
          RUN_CPU_FULL: ${{ inputs.refresh || steps.selection.outputs.full == 'true' }}
        run: |
          mkdir -p .testmon
          ignore_deps=$(python cicd/testmon_ignore_deps.py)
          testmon_option=--testmon-forceselect
          if [ "$RUN_CPU_FULL" = "true" ]; then
            testmon_option=--testmon-noselect
          fi
          # Every arm runs even after a failure, so the baseline covers all of them
          failed=0
          tm() {
            local name=$1; shift
            TESTMON_DATAFILE=".testmon/${name}.testmondata" pytest "$testmon_option" \
              -o "testmon_ignore_dependencies=${ignore_deps}" "$@" | tee -a testmon-run.log || failed=1
          }
          tm core -v --durations=10 -n4 --dist loadfile -m "not gpu and not slow and not distributed_cpu" --ignore=tests/utils/ --ignore=tests/integrations/ --ignore=tests/e2e/ --ignore=tests/patched/ --ignore=tests/cli/ --ignore=tests/monkeypatch/ tests/
          tm monkeypatch -v --durations=10 -m "not gpu and not slow and not nf4_distributed and not distributed_cpu" tests/monkeypatch/
          tm patched -v --durations=10 -m "not gpu and not slow" tests/patched/
          tm cli -v --durations=10 -m "not gpu and not slow" tests/cli/
          tm utils -v --durations=10 -n4 --dist loadfile -m "not gpu and not slow" tests/utils/
          tm integrations -v --durations=10 -n4 --dist loadfile -m "not gpu and not slow and not distributed_cpu" --ignore=tests/integrations/kernels/ tests/integrations/
          exit $failed

      - name: testmon selection summary
        if: always()
        run: |
          grep -hE "^testmon:|estmon savings|deselected" testmon-run.log || true

      # Main is the only writer: PR runs read the baseline and discard their own datafile.
      # Saved after test failures too; testmon re-runs a failing test's file until it passes.
      - name: Save testmon baseline
        if: >-
          ${{ !cancelled()
          && contains(fromJSON('["success", "failure"]'), steps.testmon.outcome)
          && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .testmon
          key: testmon-cpu-py${{ env.PYTHON_VERSION }}-torch${{ env.PYTORCH_VERSION }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
