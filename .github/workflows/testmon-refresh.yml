name: Refresh testmon baselines

on:
  workflow_dispatch:
    inputs:
      cpu:
        description: Regular CPU (all three Python/PyTorch cells)
        type: boolean
        default: false
      distributed_cpu:
        description: Distributed CPU
        type: boolean
        default: false
      slow_cpu:
        description: Slow CPU
        type: boolean
        default: false
      gpu_kernels:
        description: GPU kernels (all three Python/PyTorch cells)
        type: boolean
        default: false
      blackwell:
        description: B200 Blackwell kernels
        type: boolean
        default: false
      slow_gpu:
        description: Slow GPU (one, two, and four H100s)
        type: boolean
        default: false
      multigpu:
        description: Multi-GPU suites (general, NF4, and NVFP4)
        type: boolean
        default: false
      e2e:
        description: General single-GPU e2e
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: testmon-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require main and at least one lane
        env:
          REF: ${{ github.ref }}
          SELECTED: ${{ inputs.cpu || inputs.distributed_cpu || inputs.slow_cpu || inputs.gpu_kernels || inputs.blackwell || inputs.slow_gpu || inputs.multigpu || inputs.e2e }}
        run: |
          test "$REF" = refs/heads/main || { echo "::error::Select main to publish baselines"; exit 1; }
          test "$SELECTED" = true || { echo "::error::Select at least one lane"; exit 1; }

  cpu:
    needs: validate
    if: inputs.cpu
    uses: ./.github/workflows/testmon-cpu.yml
    with:
      refresh: true

  distributed-cpu:
    needs: validate
    if: inputs.distributed_cpu
    uses: ./.github/workflows/distributed-cpu.yml

  slow-cpu:
    needs: validate
    if: inputs.slow_cpu
    uses: ./.github/workflows/distributed-cpu.yml
    with:
      slow: true
      python_pytorch_matrix: '[{"python_version":"3.14.9","pytorch_version":"2.14.1"}]'

  gpu-kernels:
    needs: validate
    if: inputs.gpu_kernels
    uses: ./.github/workflows/testmon-gpu-kernels.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  slow-gpu:
    needs: validate
    if: inputs.slow_gpu
    uses: ./.github/workflows/gpu-slow-jobs.yml
    secrets: inherit

  e2e:
    needs: validate
    if: inputs.e2e
    uses: ./.github/workflows/testmon-e2e-baseline.yml

  multigpu:
    needs: validate
    if: inputs.multigpu
    uses: ./.github/workflows/multi-gpu-e2e-jobs.yml
    secrets: inherit

  blackwell:
    needs: validate
    if: inputs.blackwell
    uses: ./.github/workflows/testmon-blackwell.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
